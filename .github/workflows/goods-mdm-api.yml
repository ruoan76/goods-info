name: goods-mdm-api

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Install API test dependencies
        run: python -m pip install pytest fastapi httpx python-multipart psycopg2-binary "pydantic>=2" PyJWT
      - name: Start synthetic database
        run: apps/goods-mdm-api/tests/bootstrap_synthetic.sh
      - name: Run API tests
        working-directory: apps/goods-mdm-api
        env:
          GOODS_MDM_TEST_SOCKET: /tmp/gmdm-sock
          GOODS_MDM_TEST_PORT: "55432"
          GOODS_MDM_TEST_DATABASE: goods_mdm_test
          GOODS_MDM_REQUIRE_DB: "1"
        run: python -m pytest --override-ini="addopts=" -q
